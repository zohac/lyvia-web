name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout lyvia-api (for contract check)
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/lyvia-api
          token: ${{ secrets.LYVIA_API_TOKEN }}
          path: lyvia-api
          sparse-checkout: |
            openapi.yaml
            src/features/auth/domain/errors.ts

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --prod || echo "::warning::Dependency audit found vulnerabilities — review above"

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Contract check (OpenAPI)
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: pnpm run contract:check
        env:
          LYVIA_API_PATH: ${{ github.workspace }}/lyvia-api

      - name: Build (validates Nitro bundling & import resolution)
        run: pnpm build
