  <!-- Selected day -->
  <rect x="632" y="466" width="88" height="68" rx="18" fill="#1C1917"/>
  <rect x="660" y="496" width="32" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Right panel -->
  <rect x="1010" y="236" width="430" height="622" rx="34" fill="#FFFFFF"/>
  <rect x="1050" y="278" width="240" height="18" rx="9" fill="#1C1917" opacity="0.92"/>
  <rect x="1050" y="308" width="300" height="12" rx="6" fill="#78716C" opacity="0.45"/>

