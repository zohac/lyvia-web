    <rect x="1050" y="424" width="360" height="60" rx="20" fill="#F5F5F4"/>
    <rect x="1050" y="496" width="360" height="60" rx="20" fill="#1C1917"/>
    <rect x="1080" y="520" width="120" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
    <rect x="1050" y="568" width="360" height="60" rx="20" fill="#F5F5F4"/>
