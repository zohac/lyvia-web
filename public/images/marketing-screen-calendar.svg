    <rect x="316" y="354" width="46" height="10" rx="5"/>
    <rect x="432" y="354" width="46" height="10" rx="5"/>
    <rect x="548" y="354" width="46" height="10" rx="5"/>
    <rect x="664" y="354" width="46" height="10" rx="5"/>
    <rect x="780" y="354" width="46" height="10" rx="5"/>
    <rect x="896" y="354" width="46" height="10" rx="5"/>
  </g>

