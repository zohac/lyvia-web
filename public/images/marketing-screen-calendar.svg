    <g fill="#F5F5F4">
      <rect x="200" y="388" width="88" height="68" rx="18"/>
      <rect x="308" y="388" width="88" height="68" rx="18"/>
      <rect x="416" y="388" width="88" height="68" rx="18"/>
      <rect x="524" y="388" width="88" height="68" rx="18"/>
      <rect x="632" y="388" width="88" height="68" rx="18"/>
      <rect x="740" y="388" width="88" height="68" rx="18"/>
      <rect x="848" y="388" width="88" height="68" rx="18"/>
    </g>
    <g fill="#F5F5F4">
      <rect x="200" y="466" width="88" height="68" rx="18"/>
      <rect x="308" y="466" width="88" height="68" rx="18"/>
      <rect x="416" y="466" width="88" height="68" rx="18"/>
      <rect x="524" y="466" width="88" height="68" rx="18"/>
      <rect x="632" y="466" width="88" height="68" rx="18"/>
      <rect x="740" y="466" width="88" height="68" rx="18"/>
      <rect x="848" y="466" width="88" height="68" rx="18"/>
    </g>
    <g fill="#F5F5F4">
      <rect x="200" y="544" width="88" height="68" rx="18"/>
      <rect x="308" y="544" width="88" height="68" rx="18"/>
      <rect x="416" y="544" width="88" height="68" rx="18"/>
      <rect x="524" y="544" width="88" height="68" rx="18"/>
      <rect x="632" y="544" width="88" height="68" rx="18"/>
      <rect x="740" y="544" width="88" height="68" rx="18"/>
      <rect x="848" y="544" width="88" height="68" rx="18"/>
    </g>
