<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu paiements Kaora</title>
  <desc id="desc">Illustration stylisée d’un écran de paiement et de suivi des transactions.</desc>
  <defs>
